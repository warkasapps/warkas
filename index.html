<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Warkas</title>

<!-- PWA -->
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#17231F">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Warkas">

<style>
  @import url('https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@700&family=Inter:wght@400;500;600;700&family=IBM+Plex+Mono:wght@600&display=swap');
  :root {
    --ink:#17231F; --paper:#EDEAE0; --card:#F8F6EF; --amber:#E2932E;
    --chili:#B23B2E; --teal:#2E6F63; --blue:#5B7CFA; --line:#DCD7C7;
  }
  * { box-sizing: border-box; }
  body { font-family: 'Inter', sans-serif; background: var(--paper); color: var(--ink); margin: 0; padding-bottom: 70px; }
  button { font-family: inherit; cursor: pointer; }
  input, select { font-family: inherit; }
  .hidden { display: none !important; }

  #setupScreen { background: var(--ink); min-height: 100vh; display: flex; flex-direction: column; justify-content: center; padding: 24px 20px; }
  #loginScreen { background: var(--ink); min-height: 100vh; display: flex; flex-direction: column; justify-content: center; padding: 24px 20px; }
  .brand { font-family: 'Space Grotesk', sans-serif; font-weight: 700; font-size: 28px; color: var(--paper); text-align: center; }
  .brand span { color: var(--amber); }
  .loginSub { text-align: center; font-size: 12px; color: #9CAA9F; margin: 6px 0 24px; }
  .loginCard { background: var(--card); border-radius: 14px; padding: 18px; max-width: 340px; margin: 0 auto; }
  .field-label { font-size: 11.5px; color: #7A857D; font-weight: 600; display: block; margin-bottom: 5px; }
  .field { width: 100%; padding: 10px; border-radius: 8px; border: 1px solid var(--line); font-size: 13.5px; margin-bottom: 12px; }
  .btn { width: 100%; padding: 11px 0; border-radius: 9px; border: none; color: #fff; font-weight: 700; font-size: 13.5px; }
  .btn-amber { background: var(--amber); }
  .btn-teal { background: var(--teal); }
  .btn-blue { background: var(--blue); }
  .btn-chili { background: var(--chili); }
  .errorMsg { color: var(--chili); font-size: 12px; margin-bottom: 8px; }

  #appScreen header { background: var(--ink); padding: 16px; }
  .headerTop { display: flex; justify-content: space-between; align-items: flex-start; }
  .headerBrand { font-family: 'Space Grotesk', sans-serif; font-weight: 700; font-size: 19px; color: var(--paper); }
  .headerBrand span { color: var(--amber); }
  .userLine { font-size: 11px; color: #C7D0C9; margin-top: 4px; }
  .logoutBtn { background: none; border: 1px solid #33443C; color: #C7D0C9; border-radius: 8px; padding: 6px 10px; font-size: 11px; }
  .outletSwitch { display: flex; gap: 8px; margin-top: 12px; }
  .outletPill { flex: 1; padding: 9px 8px; border-radius: 8px; border: 1px solid #33443C; background: transparent; color: #C7D0C9; font-weight: 600; font-size: 12.5px; text-align: center; }
  .outletPill.active { background: var(--amber); color: var(--ink); border-color: var(--amber); }

  main { padding: 14px; max-width: 480px; margin: 0 auto; }
  .card { background: var(--card); border: 1px solid var(--line); border-radius: 12px; padding: 12px; margin-bottom: 10px; }
  .sectionTitle { font-family: 'Space Grotesk', sans-serif; font-weight: 700; font-size: 13.5px; margin: 4px 0 10px; }
  .mono { font-family: 'IBM Plex Mono', monospace; }
  .muted { color: #7A857D; font-size: 11px; }

  nav#tabbar { position: fixed; bottom: 0; left: 0; right: 0; background: var(--ink); display: flex; border-top: 1px solid #2B372F; padding-bottom: env(safe-area-inset-bottom); overflow-x: auto; }
  nav#tabbar button { flex: 0 0 auto; min-width: 64px; background: none; border: none; padding: 10px 6px 8px; color: #7C897E; font-size: 10.5px; font-weight: 600; white-space: nowrap; }
  nav#tabbar button.active { color: var(--amber); }

  .prodRow { display: flex; justify-content: space-between; align-items: center; padding: 10px 0; border-bottom: 1px dashed var(--line); }
  .prodRow:last-child { border-bottom: none; }
  .qtyBtn { width: 26px; height: 26px; border-radius: 50%; border: 1px solid var(--line); background: #fff; font-weight: 700; }
  .channelPill { padding: 6px 11px; border-radius: 20px; border: 1.5px solid var(--line); background: #fff; font-size: 11.5px; font-weight: 700; color: #54605A; margin-right: 6px; margin-bottom: 6px; }
  .channelPill.active { background: var(--teal); border-color: var(--teal); color: #fff; }

  .toast { position: fixed; bottom: 80px; left: 14px; right: 14px; max-width: 452px; margin: 0 auto; background: #fff; border-radius: 12px; padding: 14px; box-shadow: 0 4px 20px rgba(0,0,0,0.2); font-family: 'IBM Plex Mono', monospace; font-size: 12.5px; z-index: 50; }
  .toast.err { background: #FBEAE6; border: 1px solid var(--chili); color: #7A2E24; }
  .toast.ok { background: #E2F0EC; border: 1px solid var(--teal); color: #1a4a40; }

  .stokBar { height: 5px; background: #E5E1D3; border-radius: 4px; overflow: hidden; margin-top: 6px; }
  .stokBar div { height: 100%; }
  .locTab { padding: 7px 10px; border-radius: 7px; border: 1px solid var(--line); background: #fff; font-size: 11px; font-weight: 600; margin-right: 6px; }
  .locTab.active { background: var(--ink); color: var(--paper); border-color: var(--ink); }

  .spinner { display: inline-block; width: 14px; height: 14px; border: 2px solid #ccc; border-top-color: var(--teal); border-radius: 50%; animation: spin 0.7s linear infinite; vertical-align: -3px; }
  @keyframes spin { to { transform: rotate(360deg); } }
</style>
</head>
<body>

<!-- ===== SETUP (isi sekali, tersimpan di HP) ===== -->
<div id="setupScreen" class="hidden">
  <div class="brand">Warkas<span>.</span></div>
  <div class="loginSub">Sambungkan ke Google Sheets kamu (sekali saja)</div>
  <div class="loginCard">
    <label class="field-label">URL Apps Script (diakhiri /exec)</label>
    <input class="field" id="setupUrl" placeholder="https://script.google.com/macros/s/.../exec">
    <div class="errorMsg hidden" id="setupError"></div>
    <button class="btn btn-amber" id="setupBtn" onclick="saveApiUrl()">Simpan & Lanjut</button>
  </div>
</div>

<!-- ===== LOGIN ===== -->
<div id="loginScreen" class="hidden">
  <div class="brand">Warkas<span>.</span></div>
  <div class="loginSub">Masuk sesuai peran kamu</div>
  <div class="loginCard">
    <label class="field-label">Username</label>
    <input class="field" id="loginUser" placeholder="mis. owner">
    <label class="field-label">Password</label>
    <input class="field" id="loginPass" type="password" placeholder="••••">
    <div class="errorMsg hidden" id="loginError"></div>
    <button class="btn btn-amber" id="loginBtn" onclick="doLogin()">Masuk</button>
  </div>
</div>

<!-- ===== APP ===== -->
<div id="appScreen" class="hidden">
  <header>
    <div class="headerTop">
      <div>
        <div class="headerBrand">Warkas<span>.</span></div>
        <div class="userLine" id="userLine"></div>
      </div>
      <button class="logoutBtn" onclick="logout()">Keluar</button>
    </div>
    <div class="outletSwitch" id="outletSwitch"></div>
  </header>

  <main id="mainContent"></main>

  <nav id="tabbar"></nav>
</div>

<div id="toastContainer"></div>

<script>
// ---------- KONFIGURASI API ----------
let API_URL = localStorage.getItem('warkas_api_url') || '';

// Manggil Apps Script lewat JSONP (tag <script>), BUKAN fetch() —
// supaya gak kena aturan CORS browser sama sekali.
function panggilJSONP(url, params) {
  return new Promise((resolve, reject) => {
    const callbackName = 'warkasCb_' + Date.now() + '_' + Math.floor(Math.random() * 100000);
    const script = document.createElement('script');
    let selesai = false;

    function bersihkan() {
      delete window[callbackName];
      if (script.parentNode) script.parentNode.removeChild(script);
    }

    window[callbackName] = function (res) {
      selesai = true;
      bersihkan();
      resolve(res);
    };
    script.onerror = function () {
      if (!selesai) { bersihkan(); reject(new Error('Gagal menghubungi server. Cek URL Apps Script atau koneksi internet.')); }
    };

    let qs = 'callback=' + callbackName;
    Object.keys(params || {}).forEach(function (k) { qs += '&' + k + '=' + encodeURIComponent(params[k]); });
    script.src = url + (url.indexOf('?') === -1 ? '?' : '&') + qs;
    document.body.appendChild(script);

    setTimeout(function () {
      if (!selesai) { bersihkan(); reject(new Error('Waktu tunggu habis (15 detik). Coba lagi.')); }
    }, 15000);
  });
}

async function panggilAPI(action, payload) {
  const res = await panggilJSONP(API_URL, { action: action, payload: JSON.stringify(payload || {}) });
  if (!res.ok) throw new Error(res.error || 'Terjadi kesalahan di server.');
  return res.data;
}

// ---------- STATE ----------
let state = {
  user: null, outlet: null, bootstrap: null, transaksi: null,
  tab: 'jual', cart: [], channel: 'offline',
};

const TABS = [
  { id: 'jual', label: 'Jual' },
  { id: 'beli', label: 'Beli' },
  { id: 'transfer', label: 'Transfer' },
  { id: 'stok', label: 'Stok' },
  { id: 'riwayat', label: 'Riwayat' },
  { id: 'presensi', label: 'Presensi' },
  { id: 'karyawan', label: 'Karyawan' },
  { id: 'biaya', label: 'Biaya' },
  { id: 'laporan', label: 'Laporan' },
  { id: 'resep', label: 'Resep' },
];
const PERMISSIONS = {
  kasir: ['jual', 'stok', 'riwayat', 'presensi'],
  gudang: ['beli', 'transfer', 'stok', 'presensi'],
  pemilik: ['jual', 'beli', 'transfer', 'stok', 'riwayat', 'presensi', 'karyawan', 'biaya', 'laporan', 'resep'],
};
const CHANNELS = [
  { id: 'offline', label: 'Datang langsung', komisi: 0 },
  { id: 'gofood', label: 'GoFood', komisi: 20 },
  { id: 'shopeefood', label: 'ShopeeFood', komisi: 20 },
  { id: 'grabfood', label: 'GrabFood', komisi: 18 },
];

function fmtIDR(n) { return 'Rp' + Math.round(n || 0).toLocaleString('id-ID'); }
function escapeHtml(s) { return String(s == null ? '' : s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }

function showToast(msg, isErr) {
  const el = document.createElement('div');
  el.className = 'toast ' + (isErr ? 'err' : 'ok');
  el.innerHTML = msg;
  document.getElementById('toastContainer').appendChild(el);
  setTimeout(() => el.remove(), 4000);
}

// ---------- SETUP AWAL ----------
function initApp() {
  if (!API_URL) {
    document.getElementById('setupScreen').classList.remove('hidden');
    return;
  }
  const savedUser = localStorage.getItem('warkas_user');
  if (savedUser) {
    try {
      state.user = JSON.parse(savedUser);
      loadBootstrapAndEnter();
      return;
    } catch (e) { /* data tersimpan rusak, lanjut ke login biasa */ }
  }
  document.getElementById('loginScreen').classList.remove('hidden');
}
async function saveApiUrl() {
  const url = document.getElementById('setupUrl').value.trim();
  const btn = document.getElementById('setupBtn');
  const errBox = document.getElementById('setupError');
  errBox.classList.add('hidden');
  if (!url) return;
  btn.disabled = true;
  btn.innerHTML = '<span class="spinner"></span> Menguji koneksi...';
  try {
    const res = await panggilJSONP(url, {});
    if (!res.ok) throw new Error('Server merespons tapi tidak sesuai format.');
    localStorage.setItem('warkas_api_url', url);
    API_URL = url;
    document.getElementById('setupScreen').classList.add('hidden');
    document.getElementById('loginScreen').classList.remove('hidden');
  } catch (e) {
    errBox.innerText = 'Gagal konek: ' + e.message + '. Cek lagi URL-nya.';
    errBox.classList.remove('hidden');
    btn.disabled = false;
    btn.innerText = 'Simpan & Lanjut';
  }
}

// ---------- LOGIN ----------
async function doLogin() {
  const username = document.getElementById('loginUser').value.trim();
  const password = document.getElementById('loginPass').value;
  const btn = document.getElementById('loginBtn');
  const errBox = document.getElementById('loginError');
  errBox.classList.add('hidden');
  btn.disabled = true;
  btn.innerHTML = '<span class="spinner"></span> Memproses...';
  try {
    const user = await panggilAPI('login', { username: username, password: password });
    state.user = user;
    localStorage.setItem('warkas_user', JSON.stringify(user));
    await loadBootstrapAndEnter();
  } catch (e) {
    btn.disabled = false;
    btn.innerText = 'Masuk';
    errBox.innerText = e.message || 'Gagal login.';
    errBox.classList.remove('hidden');
  }
}

function logout() {
  localStorage.removeItem('warkas_user');
  state = { user: null, outlet: null, bootstrap: null, transaksi: null, tab: 'jual', cart: [], channel: 'offline' };
  document.getElementById('appScreen').classList.add('hidden');
  document.getElementById('loginScreen').classList.remove('hidden');
  document.getElementById('loginUser').value = '';
  document.getElementById('loginPass').value = '';
  document.getElementById('loginBtn').disabled = false;
  document.getElementById('loginBtn').innerText = 'Masuk';
}

async function loadBootstrapAndEnter() {
  try {
    const boot = await panggilAPI('getBootstrap', {});
    state.bootstrap = boot;
    const role = state.user.role;
    state.outlet = state.user.outlet || (role === 'gudang' ? boot.gudangNama : boot.outlets[0]);
    if (PERMISSIONS[role].indexOf(state.tab) === -1) state.tab = PERMISSIONS[role][0];
    document.getElementById('setupScreen').classList.add('hidden');
    document.getElementById('loginScreen').classList.add('hidden');
    document.getElementById('appScreen').classList.remove('hidden');
    renderHeader();
    renderTabbar();
    await loadTransaksiThenRender();
  } catch (e) {
    localStorage.removeItem('warkas_user');
    document.getElementById('appScreen').classList.add('hidden');
    document.getElementById('loginScreen').classList.remove('hidden');
    alert('Gagal mengambil data: ' + e.message + '. Silakan login lagi.');
  }
}

async function loadTransaksiThenRender() {
  try {
    state.transaksi = await panggilAPI('getTransaksi', {});
  } catch (e) {
    state.transaksi = { jual: [], beli: [], transfer: [] };
  }
  renderTab();
}

// ---------- HEADER ----------
function renderHeader() {
  document.getElementById('userLine').innerText = state.user.nama + ' · ' + state.user.role;
  const sw = document.getElementById('outletSwitch');
  if (state.user.role === 'gudang') {
    sw.innerHTML = '<div class="muted" style="color:#9CAA9F">📦 Bertugas di ' + escapeHtml(state.bootstrap.gudangNama) + '</div>';
    return;
  }
  const locked = state.user.role === 'kasir';
  sw.innerHTML = state.bootstrap.outlets.map(function (o) {
    const active = o === state.outlet;
    return '<button class="outletPill' + (active ? ' active' : '') + '" ' +
      (locked ? 'disabled style="opacity:' + (active ? '1' : '0.35') + '"' : 'onclick="switchOutlet(\'' + o + '\')"') +
      '>' + escapeHtml(o) + '</button>';
  }).join('');
}
function switchOutlet(o) {
  state.outlet = o;
  renderHeader();
  renderTab();
}

// ---------- TABBAR ----------
function renderTabbar() {
  const nav = document.getElementById('tabbar');
  const allowed = PERMISSIONS[state.user.role];
  nav.innerHTML = TABS.filter(function (t) { return allowed.indexOf(t.id) !== -1; }).map(function (t) {
    return '<button class="' + (state.tab === t.id ? 'active' : '') + '" onclick="switchTab(\'' + t.id + '\')">' + t.label + '</button>';
  }).join('');
}
function switchTab(id) {
  state.tab = id;
  renderTabbar();
  renderTab();
}

// ---------- MAIN RENDER ROUTER ----------
function renderTab() {
  const main = document.getElementById('mainContent');
  if (state.tab === 'jual') main.innerHTML = renderJual();
  if (state.tab === 'beli') main.innerHTML = renderBeli();
  if (state.tab === 'transfer') main.innerHTML = renderTransfer();
  if (state.tab === 'stok') main.innerHTML = renderStok();
  if (state.tab === 'riwayat') main.innerHTML = renderRiwayat();
  if (state.tab === 'presensi') renderPresensi();
  if (state.tab === 'karyawan') renderKaryawan();
  if (state.tab === 'biaya') main.innerHTML = renderBiaya();
  if (state.tab === 'laporan') renderLaporan();
  if (state.tab === 'resep') main.innerHTML = renderResep();
}

// ---------- TAB: JUAL ----------
function renderJual() {
  const produk = state.bootstrap.produk.filter(function (p) { return p.outlets.indexOf(state.outlet) !== -1; });
  const ch = CHANNELS.find(function (c) { return c.id === state.channel; });

  let html = '<div class="sectionTitle">Catat penjualan — ' + escapeHtml(state.outlet) + '</div>';
  html += '<div style="margin-bottom:12px">';
  CHANNELS.forEach(function (c) {
    html += '<button class="channelPill' + (c.id === state.channel ? ' active' : '') + '" onclick="setChannel(\'' + c.id + '\')">' + c.label + '</button>';
  });
  if (ch.komisi > 0) html += '<div class="muted" style="margin-top:4px">Potongan komisi ' + ch.label + ': <b style="color:var(--chili)">' + ch.komisi + '%</b></div>';
  html += '</div>';

  if (state.channel === 'offline') {
    html += '<div class="card" style="margin-bottom:12px">' +
      '<label class="field-label">Nama pelanggan (opsional)</label><input class="field" id="pelangganNama" placeholder="mis. Bu Rina" style="margin-bottom:8px">' +
      '<label class="field-label">No. HP (opsional)</label><input class="field" id="pelangganHp" placeholder="08xx xxxx xxxx" style="margin-bottom:0">' +
      '</div>';
  } else {
    html += '<div class="muted" style="margin-bottom:12px;font-style:italic">Data pelanggan tidak tersedia untuk pesanan online.</div>';
  }

  html += '<div class="sectionTitle">Pilih produk</div>';
  produk.forEach(function (p) {
    const harga = state.channel === 'offline' ? p.harga : p.hargaOnline;
    const q = getCartQtyInput(p.id);
    html += '<div class="card">' +
      '<div style="display:flex;justify-content:space-between"><b>' + escapeHtml(p.nama) + '</b>' +
      '<span class="mono">' + fmtIDR(harga) + '</span></div>' +
      '<div style="display:flex;justify-content:space-between;align-items:center;margin-top:8px">' +
      '<div><button class="qtyBtn" onclick="stepQty(\'' + p.id + '\',-1)">−</button> ' +
      '<span class="mono" id="qty_' + p.id + '" style="display:inline-block;width:24px;text-align:center">' + q + '</span> ' +
      '<button class="qtyBtn" onclick="stepQty(\'' + p.id + '\',1)">+</button></div>' +
      '<button class="btn btn-teal" style="width:auto;padding:8px 14px" onclick="addToCart(\'' + p.id + '\')">+ Keranjang</button>' +
      '</div></div>';
  });

  if (state.cart.length > 0) {
    html += '<div class="sectionTitle" style="margin-top:16px">Keranjang</div><div class="card">';
    let subtotal = 0;
    state.cart.forEach(function (it) {
      const p = state.bootstrap.produk.find(function (x) { return x.id === it.produkId; });
      const harga = state.channel === 'offline' ? p.harga : p.hargaOnline;
      subtotal += harga * it.qty;
      html += '<div class="prodRow"><span>' + escapeHtml(p.nama) + ' x' + it.qty + '</span>' +
        '<span><span class="mono">' + fmtIDR(harga * it.qty) + '</span> ' +
        '<button onclick="removeFromCart(\'' + it.produkId + '\')" style="background:none;border:none;color:var(--chili);font-weight:700">✕</button></span></div>';
    });
    html += '<div style="display:flex;justify-content:space-between;font-weight:700;padding-top:8px">Total<span class="mono">' + fmtIDR(subtotal) + '</span></div>';
    html += '<button class="btn btn-teal" style="margin-top:10px" onclick="checkout()">Selesaikan Pesanan</button>';
    html += '</div>';
  }
  return html;
}

let qtyInputs = {};
function getCartQtyInput(id) { return qtyInputs[id] || 1; }
function stepQty(id, delta) {
  qtyInputs[id] = Math.max(1, (qtyInputs[id] || 1) + delta);
  document.getElementById('qty_' + id).innerText = qtyInputs[id];
}
function setChannel(id) { state.channel = id; renderTab(); }
function addToCart(produkId) {
  const qty = qtyInputs[produkId] || 1;
  const existing = state.cart.find(function (c) { return c.produkId === produkId; });
  if (existing) existing.qty += qty; else state.cart.push({ produkId: produkId, qty: qty });
  qtyInputs[produkId] = 1;
  renderTab();
}
function removeFromCart(produkId) {
  state.cart = state.cart.filter(function (c) { return c.produkId !== produkId; });
  renderTab();
}
async function checkout() {
  if (state.cart.length === 0) return;
  showToast('<span class="spinner"></span> Memproses pesanan...', false);
  const pelangganNama = state.channel === 'offline' && document.getElementById('pelangganNama') ? document.getElementById('pelangganNama').value.trim() : '';
  const pelangganHp = state.channel === 'offline' && document.getElementById('pelangganHp') ? document.getElementById('pelangganHp').value.trim() : '';
  try {
    const hasil = await panggilAPI('recordSale', { lokasi: state.outlet, oleh: state.user.nama, channel: state.channel, items: state.cart, pelangganNama: pelangganNama, pelangganHp: pelangganHp });
    showToast('✅ Order #' + hasil.orderNo + ' tercatat. Total ' + fmtIDR(hasil.totalBersih), false);
    state.cart = [];
    await loadBootstrapAndEnter();
  } catch (e) {
    showToast('❌ ' + e.message, true);
  }
}

// ---------- TAB: BELI ----------
function renderBeli() {
  const bahan = state.bootstrap.bahan;
  const supplierAll = state.bootstrap.supplier || [];
  const firstBahanId = bahan[0] ? bahan[0].id : '';
  let html = '<div class="sectionTitle">Catat pembelian dari supplier</div><div class="card">';
  html += '<label class="field-label">Bahan baku</label><select class="field" id="beliBahan" onchange="updateSupplierBeli()">';
  bahan.forEach(function (b) { html += '<option value="' + b.id + '">' + escapeHtml(b.nama) + ' (gudang: ' + (b.stok[state.bootstrap.gudangNama] || 0) + b.satuan + ')</option>'; });
  html += '</select>';
  html += '<label class="field-label">Beli dari supplier</label><select class="field" id="beliSupplier"></select>';
  html += '<label class="field-label">Jumlah masuk</label><input class="field" type="number" id="beliQty" value="1000">';

let stokLokasiAktif = null;
function renderStok() {
  const bahan = state.bootstrap.bahan;
  const lokasiList = [state.bootstrap.gudangNama].concat(state.bootstrap.outlets);
  if (!stokLokasiAktif) stokLokasiAktif = lokasiList[0];
  let html = '<div class="sectionTitle">Stok per lokasi</div><div style="margin-bottom:12px">';
  lokasiList.forEach(function (l) {
    html += '<button class="locTab' + (l === stokLokasiAktif ? ' active' : '') + '" onclick="setStokLokasi(\'' + escapeHtml(l) + '\')">' + (l === state.bootstrap.gudangNama ? 'Gudang' : l.replace('Outlet ', '')) + '</button>';
  });
  html += '</div>';
  bahan.forEach(function (b) {
    const qty = b.stok[stokLokasiAktif] || 0;
    const isGudang = stokLokasiAktif === state.bootstrap.gudangNama;
    const threshold = isGudang ? b.stokMinimum * 3 : b.stokMinimum;
    const low = qty <= threshold;
    const pct = Math.min(100, (qty / (threshold * 2 || 1)) * 100);
    html += '<div class="card"><div style="display:flex;justify-content:space-between"><b>' + escapeHtml(b.nama) + '</b>' +
      '<span class="mono" style="color:' + (low ? 'var(--chili)' : 'var(--ink)') + '">' + qty + b.satuan + '</span></div>' +
      '<div class="stokBar"><div style="width:' + pct + '%;background:' + (low ? 'var(--chili)' : (isGudang ? 'var(--blue)' : 'var(--teal)')) + '"></div></div></div>';
  });
  return html;
}

let riwayatSubView = 'order';
function renderRiwayat() {

  let html = '<div style="display:flex;gap:6px;margin-bottom:12px">' +
    '<button class="locTab' + (riwayatSubView === 'order' ? ' active' : '') + '" onclick="setRiwayatSubView(\'order\')">Per Order</button>' +

    const grup = {};
    jual.filter(function (j) { return j.pelangganNama; }).forEach(function (j) {

      grup[key].transaksi.push(j);

        '<div><b>' + escapeHtml(g.nama) + '</b><br><span class="muted">' + g.transaksi.length + 'x kunjungan' + (g.hp ? ' · ' + escapeHtml(g.hp) : '') + '</span></div>' +

      '<span class="mono" style="font-weight:700;color:var(--teal)">' + fmtIDR(j.totalBersih) + '</span></div></div>';
  });

  html += '<div class="sectionTitle" style="margin-top:16px">Pembelian & transfer terbaru</div>';

    .concat(t.transfer.slice(0, 10).map(function (tr) { return { tipe: 'Transfer', teks: tr.bahanId + ' ' + tr.qty + ' → ' + tr.keLokasi, waktu: tr.waktu }; }));
  if (gabung.length === 0) html += '<div class="muted">Belum ada.</div>';
  gabung.forEach(function (g) {
    html += '<div class="card" style="padding:9px 12px"><span class="muted">' + g.tipe + '</span> — ' + escapeHtml(g.teks) + '</div>';
  });

function todayStr() {
  const d = new Date();
  return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0');
}

function renderPresensiCard(emp) {
  const card = document.getElementById('presensiCard');
  const hariIni = presensiSaya.find(function (p) { return p.tanggal === todayStr(); });
  const shiftInfo = emp && emp.shiftMulai ? '<div class="muted">Shift ' + escapeHtml(emp.shiftNama || '') + ': ' + emp.shiftMulai + '–' + emp.shiftSelesai + '</div>' : '';

  if (!hariIni || !hariIni.jamMasuk) {
    card.innerHTML = shiftInfo + '<button class="btn btn-teal" style="margin-top:10px" onclick="absenMasuk()">⏰ Absen Masuk</button>';
  } else if (!hariIni.jamPulang) {

      '<div style="margin-top:8px">Masuk jam <b class="mono">' + hariIni.jamMasuk + '</b>' + (hariIni.status === 'telat' ? ' <span style="color:var(--chili)">· telat</span>' : '') + '</div>' +
      '<button class="btn btn-amber" style="margin-top:10px" onclick="absenPulang()">Absen Pulang</button>';
  } else {
    card.innerHTML = '<div style="color:var(--teal);font-weight:700">✅ Sudah absen: ' + hariIni.jamMasuk + ' – ' + hariIni.jamPulang + '</div>';
  }
}

function renderPresensiHistory(list) {

function hitungGaji(id) {
  const emp = (state.bootstrap.employees || []).find(function (e) { return e.id === id; });
  const records = presensiSemua.filter(function (p) { return p.pegawaiId === id; });
  const hadir = records.filter(function (r) { return r.status === 'hadir' || r.status === 'telat'; }).length;
  const telat = records.filter(function (r) { return r.status === 'telat'; }).length;
  const izin = records.filter(function (r) { return r.status === 'izin'; }).length;
  let kotor, potongan;
  if (emp.tipeGaji === 'harian') { kotor = hadir * emp.nominal; potongan = telat * 10000; }
  else { kotor = emp.nominal; potongan = 0; }
  return { emp: emp, hadir: hadir, telat: telat, izin: izin, kotor: kotor, potongan: potongan, bersih: kotor - potongan };
}
function periodeSekarang() {
  return new Date().toLocaleDateString('id-ID', { month: 'long', year: 'numeric' });
}
function renderPenggajian() {
  const periode = periodeSekarang();
  const biayaList = (state.transaksi && state.transaksi.biaya) || [];
  let html = '';
  (state.bootstrap.employees || []).forEach(function (e) {
    const g = hitungGaji(e.id);
    const sudah = biayaList.some(function (b) { return b.kategori === 'Gaji Karyawan' && b.keterangan.indexOf(e.nama) !== -1 && b.keterangan.indexOf(periode) !== -1; });
    html += '<div class="card">' +
      '<div style="display:flex;justify-content:space-between"><div><b>' + escapeHtml(e.nama) + '</b><br><span class="muted">' + escapeHtml(e.posisi) + ' · ' + (e.tipeGaji === 'harian' ? 'harian' : 'bulanan') + '</span></div>' +
      (sudah ? '<span style="font-size:10px;font-weight:700;color:var(--teal);background:#E2F0EC;padding:3px 8px;border-radius:20px;height:fit-content">Lunas ' + periode + '</span>' : '') + '</div>';
    html += '<div style="margin-top:8px;border-top:1px dashed var(--line);padding-top:6px">';
    if (e.tipeGaji === 'harian') html += '<div style="display:flex;justify-content:space-between;font-size:12.5px"><span>' + g.hadir + ' hari hadir × ' + fmtIDR(e.nominal) + '</span><span class="mono">' + fmtIDR(g.kotor) + '</span></div>';
    else html += '<div style="display:flex;justify-content:space-between;font-size:12.5px"><span>Gaji pokok bulanan</span><span class="mono">' + fmtIDR(g.kotor) + '</span></div>';
    if (g.potongan > 0) html += '<div style="display:flex;justify-content:space-between;font-size:12px;color:var(--chili)"><span>Potongan telat (' + g.telat + 'x)</span><span class="mono">-' + fmtIDR(g.potongan) + '</span></div>';
    html += '<div style="display:flex;justify-content:space-between;font-weight:700;margin-top:4px;padding-top:4px;border-top:1px solid var(--line)"><span>Total diterima</span><span class="mono">' + fmtIDR(g.bersih) + '</span></div></div>';
    html += sudah
      ? '<button class="btn" style="margin-top:10px;background:#fff;border:1px solid var(--line);color:#9A9488" disabled>Sudah dibayar bulan ini</button>'
      : '<button class="btn btn-teal" style="margin-top:10px" onclick="bayarGaji(\'' + e.id + '\',' + g.bersih + ')">💵 Bayar & catat sebagai biaya</button>';
    html += '</div>';
  });
  return html;
}

    '<label class="field-label">Posisi</label><input class="field" id="nk_posisi" placeholder="mis. Bantu Dapur">' +
    '<label class="field-label">Lokasi kerja</label><select class="field" id="nk_lokasi">' +
    [state.bootstrap.gudangNama].concat(state.bootstrap.outlets).map(function (l) { return '<option value="' + escapeHtml(l) + '">' + escapeHtml(l) + '</option>'; }).join('') + '</select>' +
    '<label class="field-label">Tipe gaji</label><select class="field" id="nk_tipe"><option value="harian">Harian</option><option value="bulanan">Bulanan</option></select>' +
    '<label class="field-label">Nominal</label><input class="field" type="number" id="nk_nominal" value="100000">' +
    '<label class="field-label">Nama shift</label><input class="field" id="nk_shiftNama" value="Pagi">' +
    '<div style="display:flex;gap:8px"><div style="flex:1"><label class="field-label">Jam mulai</label><input class="field" type="time" id="nk_shiftMulai" value="08:00"></div>' +
    '<div style="flex:1"><label class="field-label">Jam selesai</label><input class="field" type="time" id="nk_shiftSelesai" value="17:00"></div></div>' +
    '<label style="display:flex;align-items:center;gap:8px;margin:10px 0;cursor:pointer"><input type="checkbox" id="nk_akses" onchange="toggleAksesFields()"> <span style="font-size:12.5px;font-weight:600">Buatkan akun login</span></label>' +
    '<div id="nk_aksesFields" class="hidden">' +
    '<label class="field-label">Username</label><input class="field" id="nk_username" placeholder="mis. yanto1">' +
    '<label class="field-label">Password</label><input class="field" id="nk_password" value="1234">' +
    '</div>' +
    '<button class="btn btn-teal" onclick="simpanKaryawanBaru()">Simpan karyawan</button>' +
    '</div>';
  return html;
}
function toggleEditKaryawan(id) { document.getElementById('editBox_' + id).classList.toggle('hidden'); }
function toggleTambahKaryawan() { document.getElementById('formTambahKaryawan').classList.toggle('hidden'); }
function toggleAksesFields() { document.getElementById('nk_aksesFields').classList.toggle('hidden', !document.getElementById('nk_akses').checked); }

async function simpanEditKaryawan(id) {
  showToast('<span class="spinner"></span> Menyimpan...', false);
  try {
    await panggilAPI('updateEmployee', {
      id: id, tipeGaji: document.getElementById('tipe_' + id).value, nominal: Number(document.getElementById('nominal_' + id).value),
      shiftNama: document.getElementById('shiftNama_' + id).value, shiftMulai: document.getElementById('shiftMulai_' + id).value, shiftSelesai: document.getElementById('shiftSelesai_' + id).value,
    });
    showToast('✅ Data karyawan diperbarui.', false);
    await loadBootstrapAndEnter();
    switchTab('karyawan');
    karyawanSubView = 'data';
    renderKaryawanBody();
  } catch (e) { showToast('❌ ' + e.message, true); }
}
async function simpanKaryawanBaru() {
  const nama = document.getElementById('nk_nama').value.trim();
  const nominal = Number(document.getElementById('nk_nominal').value);
  if (!nama || !nominal) return;
  const beriAkses = document.getElementById('nk_akses').checked;
  showToast('<span class="spinner"></span> Menyimpan...', false);
  try {
    await panggilAPI('addEmployee', {
      nama: nama, posisi: document.getElementById('nk_posisi').value.trim() || 'Karyawan', lokasi: document.getElementById('nk_lokasi').value,
      tipeGaji: document.getElementById('nk_tipe').value, nominal: nominal,
      shiftNama: document.getElementById('nk_shiftNama').value, shiftMulai: document.getElementById('nk_shiftMulai').value, shiftSelesai: document.getElementById('nk_shiftSelesai').value,
      beriAkses: beriAkses, username: document.getElementById('nk_username').value.trim(), password: document.getElementById('nk_password').value.trim(),
      role: document.getElementById('nk_lokasi').value === state.bootstrap.gudangNama ? 'gudang' : 'kasir',
    });
    showToast('✅ Karyawan baru ditambahkan.', false);
    await loadBootstrapAndEnter();
    switchTab('karyawan');
    karyawanSubView = 'data';
    renderKaryawanBody();
  } catch (e) { showToast('❌ ' + e.message, true); }
}

// ---------- TAB: BIAYA ----------
function renderBiaya() {
  const biayaList = (state.transaksi && state.transaksi.biaya) || [];
  const total = biayaList.reduce(function (s, b) { return s + Number(b.jumlah); }, 0);
  let html = '<div class="sectionTitle">Catat pengeluaran operasional</div><div class="card">' +
    '<label class="field-label">Kategori</label><select class="field" id="biayaKategori">' +
    BIAYA_KATEGORI.map(function (k) { return '<option value="' + k + '">' + k + '</option>'; }).join('') + '</select>' +
    '<label class="field-label">Keterangan</label><input class="field" id="biayaKeterangan" placeholder="mis. Listrik bulan ini">' +
    '<label class="field-label">Jumlah (Rp)</label><input class="field" type="number" id="biayaJumlah" value="0">' +
    '<button class="btn btn-chili" onclick="submitBiaya()">+ Catat pengeluaran</button></div>';
  html += '<div class="card" style="display:flex;justify-content:space-between;align-items:center"><span style="font-weight:600;font-size:12.5px">Total biaya tercatat</span><span class="mono" style="font-weight:700;font-size:15px;color:var(--chili)">' + fmtIDR(total) + '</span></div>';
  html += '<div class="sectionTitle" style="margin-top:16px">Riwayat pengeluaran</div>';
  if (biayaList.length === 0) html += '<div class="muted">Belum ada biaya tercatat.</div>';
  biayaList.forEach(function (b) {
    html += '<div class="card" style="display:flex;justify-content:space-between;padding:9px 12px"><div><div style="font-size:13px;font-weight:600">' + escapeHtml(b.keterangan) + '</div><div class="muted">' + escapeHtml(b.kategori) + ' · ' + escapeHtml(b.oleh) + '</div></div><span class="mono" style="font-weight:700;color:var(--chili)">-' + fmtIDR(b.jumlah) + '</span></div>';
  });
  return html;
}
async function submitBiaya() {
  const kategori = document.getElementById('biayaKategori').value;
  const keterangan = document.getElementById('biayaKeterangan').value.trim() || kategori;
  const jumlah = Number(document.getElementById('biayaJumlah').value);
  if (!jumlah || jumlah <= 0) return;
  showToast('<span class="spinner"></span> Menyimpan...', false);
  try {
    await panggilAPI('recordBiaya', { kategori: kategori, keterangan: keterangan, jumlah: jumlah, oleh: state.user.nama });
    showToast('✅ Biaya tercatat.', false);
    state.transaksi = await panggilAPI('getTransaksi', {});
    renderTab();
  } catch (e) { showToast('❌ ' + e.message, true); }
}

// ---------- TAB: LAPORAN ----------
let laporanSubView = 'ringkasan';
function renderLaporan() {
  const main = document.getElementById('mainContent');
  main.innerHTML = '<div class="sectionTitle">Laporan keuangan</div>' +
    '<div style="display:flex;gap:6px;margin-bottom:14px">' +
    '<button class="locTab' + (laporanSubView === 'ringkasan' ? ' active' : '') + '" onclick="setLaporanSubView(\'ringkasan\')">Ringkasan</button>' +
    '<button class="locTab' + (laporanSubView === 'kas' ? ' active' : '') + '" onclick="setLaporanSubView(\'kas\')">Buku Kas</button>' +
    '</div><div id="laporanBody"></div>';
  renderLaporanBody();
}
function setLaporanSubView(v) { laporanSubView = v; renderLaporanBody(); }
function renderLaporanBody() {
  document.getElementById('laporanBody').innerHTML = laporanSubView === 'ringkasan' ? renderLaporanRingkasan() : renderBukuKas();
}
function renderLaporanRingkasan() {
  const t = state.transaksi || { jual: [], beli: [], transfer: [], biaya: [] };
  const jual = t.jual;
  const pendapatanKotor = jual.reduce(function (s, j) { return s + Number(j.totalKotor); }, 0);
  const komisi = jual.reduce(function (s, j) { return s + Number(j.komisi); }, 0);
  const pendapatanBersih = pendapatanKotor - komisi;
  const pengeluaranBahan = t.beli.reduce(function (s, b) { return s + Number(b.totalHarga || 0); }, 0);
  const labaKotor = pendapatanBersih - pengeluaranBahan;
  const totalBiaya = (t.biaya || []).reduce(function (s, b) { return s + Number(b.jumlah); }, 0);
  const labaBersih = labaKotor - totalBiaya;

  let html = '<div class="card">';
  html += lineItem('Pendapatan kotor', pendapatanKotor, false);
  if (komisi > 0) html += lineItem('Dipotong komisi platform online', -komisi, true);
  html += lineItem('Pendapatan bersih', pendapatanBersih, false, true);
  html += lineItem('Biaya bahan baku', -pengeluaranBahan, true);
  html += lineItem('Laba kotor', labaKotor, false, true);
  html += lineItem('Biaya operasional', -totalBiaya, true);
  html += '<div style="display:flex;justify-content:space-between;border-top:1px solid var(--line);margin-top:8px;padding-top:8px"><span style="font-weight:700;font-size:13.5px">Laba bersih</span><span class="mono" style="font-weight:700;font-size:14px;color:' + (labaBersih >= 0 ? 'var(--teal)' : 'var(--chili)') + '">' + fmtIDR(labaBersih) + '</span></div>';
  html += '</div>';

  const perOutlet = state.bootstrap.outlets.map(function (o) { return { outlet: o, total: jual.filter(function (j) { return j.lokasi === o; }).reduce(function (s, j) { return s + Number(j.totalKotor); }, 0) }; });
  const maxOutlet = Math.max(1, Math.max.apply(null, perOutlet.map(function (o) { return o.total; })));
  html += '<div class="sectionTitle" style="margin-top:16px">Pendapatan per outlet</div>';
  perOutlet.forEach(function (o) {
    html += '<div style="margin-bottom:8px"><div style="display:flex;justify-content:space-between;font-size:12.5px"><span style="font-weight:600">' + escapeHtml(o.outlet) + '</span><span class="mono" style="font-weight:700">' + fmtIDR(o.total) + '</span></div>' +
      '<div class="stokBar"><div style="width:' + (o.total / maxOutlet * 100) + '%;background:var(--teal)"></div></div></div>';
  });

  const produkMap = {};
  jual.forEach(function (j) { (j.items || []).forEach(function (it) {
    if (!produkMap[it.namaProduk]) produkMap[it.namaProduk] = { nama: it.namaProduk, qty: 0, total: 0 };
    produkMap[it.namaProduk].qty += Number(it.qty);
    produkMap[it.namaProduk].total += Number(it.subtotal);
  }); });
  const top5 = Object.values(produkMap).sort(function (a, b) { return b.total - a.total; }).slice(0, 5);
  if (top5.length > 0) {
    html += '<div class="sectionTitle" style="margin-top:16px">Produk terlaris</div>';
    top5.forEach(function (p, i) {
      html += '<div class="card" style="display:flex;justify-content:space-between;padding:9px 12px"><span><span class="mono muted">' + (i + 1) + '</span> ' + escapeHtml(p.nama) + ' <span class="muted">(' + p.qty + ' terjual)</span></span><span class="mono" style="font-weight:700">' + fmtIDR(p.total) + '</span></div>';
    });
  }
  return html;
}
function lineItem(label, value, negative, bold) {
  return '<div style="display:flex;justify-content:space-between;padding:3px 0;font-size:' + (bold ? '13px;font-weight:700' : '12.5px') + '">' +
    '<span>' + label + '</span><span class="mono" style="color:' + (negative ? 'var(--chili)' : 'var(--ink)') + '">' + (value < 0 ? '-' : '') + fmtIDR(Math.abs(value)) + '</span></div>';
}
function renderBukuKas() {
  const t = state.transaksi || { jual: [], beli: [], transfer: [], biaya: [] };
  const entries = t.jual.map(function (j) { return { waktu: new Date(j.waktu), judul: '#' + j.orderNo, lokasi: j.lokasi, masuk: Number(j.totalBersih), keluar: 0 }; })
    .concat(t.beli.map(function (b) { return { waktu: new Date(b.waktu), judul: 'Beli ' + b.bahanId, lokasi: state.bootstrap.gudangNama, masuk: 0, keluar: Number(b.totalHarga || 0) }; }))
    .concat((t.biaya || []).map(function (b) { return { waktu: new Date(b.waktu), judul: b.keterangan, lokasi: b.kategori, masuk: 0, keluar: Number(b.jumlah) }; }))
    .sort(function (a, b) { return a.waktu - b.waktu; });
  let saldo = 0;
  const rows = entries.map(function (e) { saldo += e.masuk - e.keluar; return Object.assign({}, e, { saldo: saldo }); });
  const totalMasuk = rows.reduce(function (s, r) { return s + r.masuk; }, 0);
  const totalKeluar = rows.reduce(function (s, r) { return s + r.keluar; }, 0);

  let html = '<div style="display:flex;gap:10px;margin-bottom:10px">' +
    '<div class="card" style="flex:1"><div class="muted">Total masuk</div><div class="mono" style="font-weight:700;font-size:15px;color:var(--teal)">' + fmtIDR(totalMasuk) + '</div></div>' +
    '<div class="card" style="flex:1"><div class="muted">Total keluar</div><div class="mono" style="font-weight:700;font-size:15px;color:var(--chili)">' + fmtIDR(totalKeluar) + '</div></div></div>';
  html += '<div class="card" style="display:flex;justify-content:space-between;margin-bottom:14px"><span style="font-weight:700;font-size:12.5px">Saldo kas</span><span class="mono" style="font-weight:700;font-size:16px;color:' + (saldo >= 0 ? 'var(--teal)' : 'var(--chili)') + '">' + fmtIDR(saldo) + '</span></div>';
  rows.slice().reverse().forEach(function (r) {
    html += '<div style="display:flex;justify-content:space-between;padding:9px 0;border-bottom:1px solid var(--line)">' +
      '<div><div style="font-size:12.5px;font-weight:600">' + escapeHtml(r.judul) + '</div><div class="muted">' + r.waktu.toLocaleDateString('id-ID') + ' · ' + escapeHtml(r.lokasi) + '</div></div>' +
      '<div style="text-align:right"><div class="mono" style="font-weight:700;color:' + (r.masuk > 0 ? 'var(--teal)' : 'var(--chili)') + '">' + (r.masuk > 0 ? '+' + fmtIDR(r.masuk) : '-' + fmtIDR(r.keluar)) + '</div><div class="mono muted" style="font-size:10px">saldo ' + fmtIDR(r.saldo) + '</div></div></div>';
  });
  return html;
}

// ---------- TAB: RESEP & KETERSEDIAAN PRODUK ----------
function renderResep() {
  const produk = state.bootstrap.produk;
  const bahanMap = {};
  state.bootstrap.bahan.forEach(function (b) { bahanMap[b.id] = b; });
  let html = '<div class="sectionTitle">Resep & ketersediaan produk</div>';
  produk.forEach(function (p) {
    html += '<div class="card"><div style="display:flex;justify-content:space-between"><b>' + escapeHtml(p.nama) + '</b>' +
      '<span class="mono muted" style="font-size:11px">' + fmtIDR(p.harga) + '<br>online ' + fmtIDR(p.hargaOnline) + '</span></div>';
    html += '<div style="display:flex;gap:6px;margin:8px 0">';
    state.bootstrap.outlets.forEach(function (o) {
      const aktif = p.outlets.indexOf(o) !== -1;
      html += '<button onclick="toggleProduk(\'' + p.id + '\',\'' + escapeHtml(o) + '\')" style="padding:5px 10px;border-radius:20px;border:1.5px solid ' + (aktif ? 'var(--teal)' : 'var(--line)') + ';background:' + (aktif ? 'var(--teal)' : '#fff') + ';color:' + (aktif ? '#fff' : '#9A9488') + ';font-size:11px;font-weight:700">' + (aktif ? '✓ ' : '') + o.replace('Outlet ', '') + '</button>';
    });
    html += '</div>';
    if (p.outlets.length === 0) html += '<div style="color:var(--chili);font-size:11px;margin-bottom:8px">Tidak dijual di outlet manapun sekarang.</div>';
    html += '<div style="border-top:1px dashed var(--line);padding-top:8px">';
    (p.resep || []).forEach(function (r, i) {
      const b = bahanMap[r.b];
      html += '<div style="display:flex;justify-content:space-between;font-size:12px" class="mono"><span>' + (b ? escapeHtml(b.nama) : r.b) + '</span><span>' + r.qty + (b ? b.satuan : '') + '</span></div>';
    });
    html += '</div></div>';
  });
  return html;
}
async function toggleProduk(produkId, lokasi) {
  showToast('<span class="spinner"></span> Menyimpan...', false);
  try {
    await panggilAPI('toggleProdukOutlet', { produkId: produkId, lokasi: lokasi });
    await loadBootstrapAndEnter();
    switchTab('resep');
  } catch (e) { showToast('❌ ' + e.message, true); }
}

// ---------- ENTER KEY ----------
document.getElementById('loginPass').addEventListener('keydown', function (e) { if (e.key === 'Enter') doLogin(); });
document.getElementById('setupUrl').addEventListener('keydown', function (e) { if (e.key === 'Enter') saveApiUrl(); });

// ---------- SERVICE WORKER ----------
if ('serviceWorker' in navigator) {
  window.addEventListener('load', function () {
    navigator.serviceWorker.register('service-worker.js').catch(function () {});
  });
}

initApp();
</script>
